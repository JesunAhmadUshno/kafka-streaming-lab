# The broker stack for this study, and the reproduction path.
# Single-node KRaft, properties identical in meaning to
# conf/server.properties.template (frozen by PREREGISTRATION.md
# Section 5, packaging per Amendment A1 and DECISIONS.md D5).
# The port is published on 127.0.0.1 only: the study is single-host
# and the broker is not exposed to the network.
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: ksl-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: -Xmx512M -Xms512M
      CLUSTER_ID: NQNFVLRLQZ6CFQkjUVZe6Q
    volumes:
      - ksl-kafka-data:/var/lib/kafka/data
    mem_limit: 1g
    cpus: 2.0
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
volumes:
  ksl-kafka-data:
